_schema-version: 3.3.0
ID: btp_levelup
description: A simple CAP project.
version: 1.0.0
modules:
  - name: btp_levelup-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: btp_levelup-auth
      - name: btp_levelup-destination
      - name: btp_levelup-db
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: btp_levelup
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: btp_levelup-auth
      - name: btp_levelup-destination
      - name: btp_levelup-html5-runtime
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api # must be used in xs-app.json as well
          url: ~{mtx-url}
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"
  - name: btp_levelup-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: btp_levelup-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - nsincidents.zip
          name: nsincidents
          target-path: app/
  - name: btp_levelup-destinations
    type: com.sap.application.content
    requires:
      - name: btp_levelup-auth
        parameters:
          service-key:
            name: btp_levelup-auth-key
      - name: btp_levelup-html5-repo-host
        parameters:
          service-key:
            name: btp_levelup-html5-repo-host-key
      - name: srv-api
      - name: btp_levelup-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: btp_levelup-html5-repository
              ServiceInstanceName: btp_levelup-html5-repo-host
              ServiceKeyName: btp_levelup-html5-repo-host-key
              sap.cloud.service: btp_levelup.service
            - Authentication: OAuth2UserTokenExchange
              Name: btp_levelup-auth
              ServiceInstanceName: btp_levelup-auth
              ServiceKeyName: btp_levelup-auth-key
              sap.cloud.service: btp_levelup.service
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: nsincidents
    type: html5
    path: app/incidents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: btp_levelup-mtx
    type: nodejs
    path: gen/mtx/sidecar
    requires:
      - name: app-api
        properties:
          SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-~{app-uri}
      - name: btp_levelup-db
      - name: btp_levelup-registry
      - name: btp_levelup-auth
    build-parameters:
      builder: npm-ci
    parameters:
      memory: 256M
      disk-quota: 512M
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}
resources:
  - name: btp_levelup-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: shared
        xsappname: btp_levelup-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: btp_levelup-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
  - name: btp_levelup-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: btp_levelup-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: btp_levelup-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: service-manager
      service-plan: container
  - name: btp_levelup-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: mtx-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        xsappname: btp_levelup-${org}-${space}
        appName: btp_levelup-${org}-${space}
        displayName: btp_levelup
        description: A simple CAP project.
        category: "Category"
        appUrls:
          getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
          onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          onUpdateDependenciesAsync: true
          callbackTimeoutMillis: 300000 # Increase if your deployments are taking longer than that
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p resources
